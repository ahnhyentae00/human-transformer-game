name: bootstrap-source

on:
  push:
    branches: [main]
    paths:
      - "payload/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait until all chunks exist
        id: chunks
        shell: bash
        run: |
          if [ -f payload/part11 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct project
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          cat payload/part* | base64 --decode > /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source
          rsync -a --exclude='.github/' /tmp/source/human-transformer-game-v0.7/ ./
          rm -rf archive payload

      - name: Commit extracted source
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: import Human Transformer Game v0.7"
          git push
