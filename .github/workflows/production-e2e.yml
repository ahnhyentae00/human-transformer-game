name: production-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-e2e.yml"
      - "scripts/production-e2e.mjs"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Run production browser E2E
        env:
          BASE_URL: https://human-transformer-game-production.up.railway.app
        run: node scripts/production-e2e.mjs
