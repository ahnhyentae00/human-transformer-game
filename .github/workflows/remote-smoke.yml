name: railway-smoke
# Uses the current main branch smoke script against Railway production.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remote smoke test
        env:
          BASE_URL: https://human-transformer-game-production.up.railway.app
        run: npm run smoke:remote
